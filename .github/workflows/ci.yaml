name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main
  schedule:
  - cron: "0 13 * * 1"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

# Create a shared path for pooch cache and extracted data directory
env:
  POOCH_CACHE_DIR: ${{ github.workspace }}/.pooch_cache
  OCEANSPY_TEST_DATA_DIR: ${{ github.workspace }}/.pooch_cache/oceanspy-test-data

jobs:
  # Primes data download outside of pytest (single job, no matrix)
  prime-data:
    name: Prime test data cache
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Conda environment with Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: ci/environment.yml
        environment-name: oceanspy_test
        create-args: >-
          python=3.12
        cache-environment: true

    # Restore/save pooch cache
    - name: Restore Pooch cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.pooch_cache
        key: pooch-zenodo-10779221-md5-b0277b809840e08a84f3a5d2c3f7404b

    - name: Test primed data presence
      run: |
        echo "POOCH_CACHE_DIR=$POOCH_CACHE_DIR"
        echo "OCEANSPY_TEST_DATA_DIR=$OCEANSPY_TEST_DATA_DIR"
        ls -la "$POOCH_CACHE_DIR" || true
        ls -la "$OCEANSPY_TEST_DATA_DIR" || true


    # Download + untar once
    - name: Prime dataset (download + untar if missing)
      run: |
        python - <<'PY'
        import os, pooch
        from pooch import Untar

        pooch.retrieve(
            url="https://zenodo.org/record/10779221/files/Data.tar.gz?download=1",
            known_hash="md5:b0277b809840e08a84f3a5d2c3f7404b",
            path=os.environ["POOCH_CACHE_DIR"],
            processor=Untar(extract_dir="oceanspy-test-data"),
        )
        print("Primed:", os.environ["OCEANSPY_TEST_DATA_DIR"])
        PY

  pytest:
    name: Build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Wait for priming to finish
    needs: prime-data
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
    - uses: actions/checkout@v7

    - name: Install Conda environment with Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: ci/environment.yml
        environment-name: oceanspy_test
        create-args: >-
          python=${{ matrix.python-version }}
        cache-environment: true

    # Restore pooch cache in each matrix job using the key defined above
    - name: Restore Pooch cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.pooch_cache
        key: pooch-zenodo-10779221-md5-b0277b809840e08a84f3a5d2c3f7404b

    - name: Set up conda environment
      run: |
        python -m pip install -e .
        conda list

    - name: Import check
      run: python -c "import faulthandler, signal; faulthandler.register(signal.SIGTERM, all_threads=True, chain=True); import xesmf, oceanspy; print('import ok')"

    # Temporary diagnostics for intermittent exit 143 during collection
    # (a self-initiated exit_group(136463759), not a signal).
    # strace -k records the native call stack of each traced call; openat
    # shows which files were being loaded. Remove once diagnosed.
    - name: Install strace
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq strace > /dev/null
        strace -V | head -1
        strace -k -e trace=exit_group -o /dev/null true \
          || { echo "this strace build does not support -k (stack traces)"; exit 1; }

    - name: Run Tests
      run: |
        strace -f --seccomp-bpf -tt -k -s 256 -o strace.log \
          -e trace=execve,kill,tkill,tgkill,exit_group,openat \
          python - <<'PY'
        import faulthandler, signal, sys
        trace = open("sigterm_trace.log", "w")
        faulthandler.register(signal.SIGTERM, file=trace, all_threads=True, chain=True)
        import pytest
        sys.exit(pytest.main(["-v", "--cov=./", "--cov-report=xml"]))
        PY
        rc=$?
        echo "python exit status: $rc"
        exit $rc

    - name: Show diagnostics
      if: failure()
      run: |
        echo "== faulthandler trace =="
        cat sigterm_trace.log || echo "no trace file"
        echo "== strace: signals, kills, execs =="
        grep -nE "\-\-\- SIG|kill\(|execve\(|\+\+\+ killed" strace.log | tail -50 || echo "no matching strace lines"
        echo "== strace: exit_group call and its native stack =="
        grep -n -A60 "exit_group(" strace.log | head -150 || echo "no exit_group in strace log"
        echo "== strace: last 40 files opened (.py, .so, .nc, .yaml) =="
        grep -E 'openat\(.*\.(py|pyc|so[.0-9]*|nc|yaml)"' strace.log | grep -v ENOENT | tail -40 || echo "no matching openat lines"
        echo "== strace: size =="
        ls -la strace.log || echo "no strace log"

    - name: Upload code coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        env_vars: OS,PYTHON
        name: codecov-umbrella
        fail_ci_if_error: false
